<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Admin Dashboard for Blockchain Complaint Management System">
</head>
<body>
    <header class="admin-header-bar">
        <div class="admin-title">
            <span class="admin-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
            <h1>Blockchain Complaint Management System - Admin Dashboard</h1>
        </div>
        <div class="action-buttons">
            <a href="index.html" class="btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Home
            </a>
            <a href="#" class="btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1-2 2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </a>
        </div>
    </header>

    <main class="animate-on-scroll">
        <div class="stats-grid stagger-children">
            <div class="stat-card">
                <span class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
                </span>
                <div class="stat-number" id="adminTotal">0</div>
                <div class="stat-label">All Complaints</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </span>
                <div class="stat-number" id="adminPending">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </span>
                <div class="stat-number" id="adminInProgress">0</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </span>
                <div class="stat-number" id="adminResolved">0</div>
                <div class="stat-label">Resolved</div>
            </div>
        </div>

        <h2 class="dashboard-section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            All Complaints
        </h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Department</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="adminTable">
                </tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.animate-on-scroll').forEach(function(el) {
            observer.observe(el);
        });

        function updateAdminStats() {
            var table = document.getElementById('adminTable');
            if (!table) return;
            var rows = table.getElementsByTagName('tr');
            var total = rows.length;
            var pending = 0;
            var inProgress = 0;
            var resolved = 0;
            for (var i = 0; i < rows.length; i++) {
                var statusCell = rows[i].cells[3];
                if (statusCell) {
                    var select = statusCell.querySelector('select');
                    var val = select ? select.value.toLowerCase() : statusCell.textContent.trim().toLowerCase();
                    if (val === 'pending') pending++;
                    else if (val === 'in progress') inProgress++;
                    else if (val === 'resolved') resolved++;
                }
            }
            var elTotal = document.getElementById('adminTotal');
            var elPending = document.getElementById('adminPending');
            var elInProgress = document.getElementById('adminInProgress');
            var elResolved = document.getElementById('adminResolved');
            if (elTotal) elTotal.textContent = total;
            if (elPending) elPending.textContent = pending;
            if (elInProgress) elInProgress.textContent = inProgress;
            if (elResolved) elResolved.textContent = resolved;
        }

        var target = document.getElementById('adminTable');
        if (target) {
            var tableObserver = new MutationObserver(updateAdminStats);
            tableObserver.observe(target, { childList: true, subtree: true, attributes: true, characterData: true });
            document.addEventListener('change', updateAdminStats);
            updateAdminStats();
        }
    });
    </script>
</body>
</html>

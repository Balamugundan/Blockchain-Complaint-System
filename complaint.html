<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a new complaint to the Blockchain Complaint Management System">
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="admin-header-bar">
        <h1>Blockchain Complaint Management System</h1>
        <p>Submit Your Complaint</p>
    </header>
    <main>
        <div class="card animate-on-scroll">
            <div class="form-page-header">
                <div class="form-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                </div>
                <h2>Complaint Form</h2>
            </div>
            
            <div class="blockchain-badge">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                Secured by Blockchain
            </div>

            <form id="complaintForm">
                <div class="form-group">
                    <label>Complaint Title</label>
                    <input type="text" id="title" placeholder="Enter Complaint Title" required>
                </div>
                
                <div class="form-group">
                    <label>Department</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option>Police</option>
                        <option>Municipality</option>
                        <option>Electricity</option>
                        <option>Water Supply</option>
                        <option>Road Transport</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="6" required></textarea>
                </div>
                
                <button type="submit" class="btn-primary">Submit Complaint</button>
            </form>
            
            <div class="divider"></div>
            
            <div class="action-buttons">
                <a href="dashboard.html" class="back-link"><button class="btn-secondary">Go to Dashboard</button></a>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.animate-on-scroll').forEach(function(el) {
            observer.observe(el);
        });
    });
    </script>
</body>
</html>

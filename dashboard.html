<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Blockchain Complaint Management System</title>
    <meta name="description" content="Manage and track your submitted complaints on the blockchain.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="admin-header-bar">
        <div class="admin-title">
            <svg class="admin-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <h1>Blockchain Complaint Management System</h1>
        </div>
        <p>User Dashboard</p>
    </header>
    
    <main class="stagger-children">
        <div class="welcome-banner animate-on-scroll">
            <h2>Welcome, User!</h2>
            <p>Manage and track the status of your submitted complaints in real-time.</p>
        </div>
        
        <div class="stats-grid animate-on-scroll">
            <div class="stat-card">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
                </div>
                <div>
                    <div class="stat-number" id="statTotal">0</div>
                    <div class="stat-label">Total Complaints</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div>
                    <div class="stat-number" id="statPending">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <div>
                    <div class="stat-number" id="statResolved">0</div>
                    <div class="stat-label">Resolved</div>
                </div>
            </div>
        </div>

        <div class="action-buttons animate-on-scroll">
            <a href="complaint.html"><button class="btn-success">➕ New Complaint</button></a>
            <a href="index.html"><button class="btn-secondary">🏠 Home</button></a>
            <a href="login.html"><button class="btn-danger">🚪 Logout</button></a>
        </div>

        <div class="card animate-on-scroll">
            <h2 class="dashboard-section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                Complaint Status
            </h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Department</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="complaintTable">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.animate-on-scroll').forEach(function(el) {
            observer.observe(el);
        });

        function updateStats() {
            var table = document.getElementById('complaintTable');
            if (!table) return;
            var rows = table.getElementsByTagName('tr');
            var total = rows.length;
            var pending = 0;
            var resolved = 0;
            for (var i = 0; i < rows.length; i++) {
                var statusCell = rows[i].cells[3];
                if (statusCell) {
                    var text = statusCell.textContent.trim().toLowerCase();
                    if (text.indexOf('pending') !== -1) pending++;
                    else if (text.indexOf('resolved') !== -1) resolved++;
                }
            }
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statResolved').textContent = resolved;
        }

        var target = document.getElementById('complaintTable');
        if (target) {
            var tableObserver = new MutationObserver(updateStats);
            tableObserver.observe(target, { childList: true, subtree: true });
            updateStats();
        }
    });
    </script>
</body>
</html>
